[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeshare"
version = "0.1.0"
description = "Local-first JPEG metadata inspection and sanitization"
readme = "README.md"
requires-python = "==3.12.*"
license = { file = "LICENSE" }
dependencies = [
    "customtkinter==5.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
